<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityU AIMS 課表模擬器 (Hybrid Dual-Mode V19)</title>
    <style>
        :root {
            --bg-color: #f1f4f8;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --grid-line: #e2e8f0;
            --grid-line-sub: #f8fafc;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --danger: #ef4444;
            --primary: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 20px; 
            min-height: 100vh;
        }
        
        .header-title { text-align: center; margin-bottom: 16px; }
        .header-title h1 { font-size: 1.6rem; font-weight: 600; color: #334155; }

        .container { 
            display: grid; 
            grid-template-columns: 420px 1fr; 
            gap: 20px; 
            max-width: 1700px;
            margin: 0 auto;
        }

        .sidebar { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 4px 16px rgba(100, 116, 139, 0.08); 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            border: 1.5px solid var(--border-color);
            height: fit-content;
        }

        /* 匯入專區卡片化 */
        .import-section {
            background: #f8fafc;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .import-section textarea { 
            width: 100%; 
            height: 75px; 
            padding: 8px; 
            border-radius: 6px; 
            border: 1.5px solid var(--border-color); 
            font-size: 0.78rem; 
            resize: vertical; 
            font-family: monospace; 
            background: white;
        }
        
        /* 手動補登區卡片化 */
        .manual-form-section { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            background: #f8fafc; 
            padding: 12px; 
            border-radius: 10px; 
            border: 1.5px solid var(--border-color); 
        }

        .form-row { display: flex; gap: 8px; }
        .form-group { display: flex; flex-direction: column; gap: 3px; flex: 1; }
        .form-group label { font-size: 0.73rem; font-weight: 700; color: var(--text-sub); }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 6px; 
            border-radius: 6px; 
            border: 1.5px solid var(--border-color); 
            font-size: 0.82rem; 
            background: white;
            color: var(--text-main);
        }

        .btn-action { 
            width: 100%; 
            background: var(--primary); 
            color: #ffffff; 
            border: none; 
            padding: 8px 12px; 
            border-radius: 8px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 0.88rem; 
            transition: opacity 0.2s;
        }
        .btn-action:hover { opacity: 0.85; }
        .btn-clipboard { background: #0284c7; }
        .btn-manual-add { background: #0f172a; }

        .status-box { font-size: 0.82rem; padding: 8px 10px; border-radius: 6px; background: #e2e8f0; color: #334155; display: none; border: 1px solid #cbd5e1; }

        .course-card { 
            background: #f8fafc; 
            border: 1.5px solid var(--border-color); 
            border-radius: 10px; 
            padding: 12px; 
            margin-bottom: 12px; 
        }
        .course-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .course-code { font-weight: 700; font-size: 0.95rem; color: #1e293b; }
        .remove-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.4rem; font-weight: bold; }

        .select-group { margin-top: 8px; }
        .select-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-sub); margin-bottom: 3px; }
        .select-group select { width: 100%; padding: 8px; border-radius: 6px; border: 1.5px solid var(--border-color); background: white; font-size: 0.85rem; color: var(--text-main); }

        .main-content { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 4px 16px rgba(100, 116, 139, 0.08); 
            border: 1.5px solid var(--border-color);
        }
        
        .timeline-container {
            position: relative;
            display: grid;
            grid-template-columns: 80px repeat(5, 1fr);
            background: white;
            border-radius: 8px;
            overflow-x: auto;
            border: 2px solid var(--border-color);
        }
        
        .timeline-header { 
            background: #e2e8f0; 
            font-weight: 700; 
            font-size: 0.9rem; 
            text-align: center; 
            padding: 10px 0;
            border-bottom: 2px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            color: #475569;
        }

        .timeline-axis {
            position: relative;
            grid-column: 1;
            grid-row: 2;
            height: 1300px; 
            background: #f8fafc;
            border-right: 2px solid var(--border-color);
        }

        .time-label {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50px;
            font-size: 0.8rem;
            color: #64748b;
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid var(--grid-line-sub);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .time-label.hour-mark {
            border-bottom: 1px solid var(--grid-line);
            color: #334155;
        }

        .day-column {
            position: relative;
            grid-row: 2;
            height: 1300px;
            border-right: 1px solid var(--border-color);
            background: #ffffff;
            background-image: linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px),
                              linear-gradient(to bottom, var(--grid-line-sub) 1px, transparent 1px);
            background-size: 100% 100px;
            background-position: 0 0, 0 50px;
        }

        .event-block { 
            position: absolute;
            left: 3px;
            right: 3px;
            border-radius: 6px; 
            padding: 6px 8px; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start;
            gap: 2px;
            box-sizing: border-box; 
            border: 1.5px solid rgba(0,0,0,0.08);
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            overflow: hidden;
            z-index: 2;
        }
        .event-block.clash { 
            background: #fee2e2 !important; 
            color: #991b1b !important; 
            border: 2px solid #ef4444 !important; 
            z-index: 3;
        }

        .event-title { font-weight: 700; font-size: 0.85rem; line-height: 1.2; }
        .event-section { font-weight: 700; font-size: 0.78rem; background: rgba(255,255,255,0.6); padding: 1px 4px; border-radius: 3px; width: fit-content; margin-top: 1px; }
        .event-time { font-weight: 600; font-size: 0.72rem; margin-top: 1px; }
        .event-detail { font-size: 0.7rem; line-height: 1.15; }
        .clash-icon {
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-size: 1rem;
        }

        .clash-alert { background: #fee2e2; color: #991b1b; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 0.9rem; display: none; font-weight: 700; border: 1.5px solid #fca5a5; }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>CityU AIMS 課表模擬器</h1>
    </div>

    <div class="container">
        <div class="sidebar">
            
            <!-- 方式一：原本的一鍵與文字框解析匯入區 -->
            <div class="import-section">
                <div style="font-size: 0.88rem; font-weight: 700; color: #334155;">⚡ 方式一：自動解析匯入</div>
                <button class="btn-action btn-clipboard" onclick="importFromClipboard()">📋 一鍵貼上剪貼簿內容並解析</button>
                <div style="font-size: 0.72rem; color: var(--text-sub);">提示：在 AIMS 全選複製後，直接點擊上方按鈕。</div>
                
                <div style="font-size: 0.78rem; font-weight: 700; margin-top: 2px; color: var(--text-sub);">或手動貼上表格原始文字：</div>
                <textarea id="aimsText" placeholder="在此處貼上從 AIMS 複製的整段表格文字..."></textarea>
                <button class="btn-action" onclick="handleManualTextParse()">解析文字框內容</button>
            </div>

            <!-- 方式二：新增的手動填寫補登區 -->
            <div class="manual-form-section">
                <div style="font-size: 0.88rem; font-weight: 700; color: #334155;">✏️ 方式二：手動補登未識別科目</div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>科目代號 / 名稱</label>
                        <input type="text" id="inputTitle" placeholder="例如: GE1234">
                    </div>
                    <div class="form-group" style="flex: 0.7;">
                        <label>課堂編號</label>
                        <input type="text" id="inputSection" placeholder="C01 / T01">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>星期</label>
                        <select id="inputDay">
                            <option value="1">Mon (星期一)</option>
                            <option value="2">Tue (星期二)</option>
                            <option value="3">Wed (星期三)</option>
                            <option value="4">Thu (星期四)</option>
                            <option value="5">Fri (星期五)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>上課房間</label>
                        <input type="text" id="inputRoom" placeholder="例如: YEUNG P4702">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>開始時間</label>
                        <input type="time" id="inputStartTime" value="09:00">
                    </div>
                    <div class="form-group">
                        <label>結束時間</label>
                        <input type="time" id="inputEndTime" value="10:50">
                    </div>
                </div>

                <button class="btn-action btn-manual-add" onclick="handleAddCustomSection()">＋ 手動加入科目列表</button>
            </div>

            <div class="status-box" id="statusBox"></div>

            <div>
                <div style="font-size: 0.92rem; font-weight: 700; margin-bottom: 8px;">已識別之科目列表：</div>
                <div id="courseContainer"></div>
            </div>
        </div>

        <div class="main-content">
            <div class="clash-alert" id="clashAlert">⚠️ 注意：時間表上有課程時間相撞 (Clash)！</div>
            
            <div class="timeline-container" id="timelineContainer"></div>
        </div>
    </div>

    <script>
        const days = ['時間', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
        const startHourGlobal = 9;
        const totalHours = 13;
        const minuteHeight = 100 / 60; 
        const dayMap = { 'M': 1, 'T': 2, 'W': 3, 'R': 4, 'F': 5 };

        const distinctColorPalette = [
            { bg: '#dcfce7', border: '#86efac', text: '#166534' }, // 綠色
            { bg: '#f3e8ff', border: '#d8b4fe', text: '#6b21a8' }, // 紫色
            { bg: '#fce7f3', border: '#f472b6', text: '#831843' }, // 粉紅色
            { bg: '#fef3c7', border: '#fde047', text: '#92400e' }, // 暖黃色
            { bg: '#ffedd5', border: '#fdba74', text: '#9a3412' }, // 橙色
            { bg: '#ccfbf1', border: '#5eead4', text: '#0f766e' }, // 青綠色
            { bg: '#dbeafe', border: '#93c5fd', text: '#1e40af' }, // 藍色
            { bg: '#fae8ff', border: '#e879f9', text: '#701a75' }  // 桃紫色
        ];

        let courses = [];

        window.addEventListener('DOMContentLoaded', () => {
            initTimelineGrid();
        });

        async function importFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (!text.trim()) { alert('剪貼簿中沒有內容！'); return; }
                parseAIMSContent(text);
                showStatus(`✓ 成功從剪貼簿匯入！目前共 ${courses.length} 個科目。`);
                renderCoursesUI();
            } catch (err) {
                alert('無法讀取剪貼簿，請直接貼在下方的文字框中！');
            }
        }

        function initTimelineGrid() {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = '';
            
            days.forEach((day, idx) => {
                const header = document.createElement('div');
                header.className = 'timeline-header';
                header.style.gridColumn = idx + 1;
                header.style.gridRow = 1;
                header.innerText = day;
                container.appendChild(header);
            });

            const axis = document.createElement('div');
            axis.className = 'timeline-axis';
            for (let i = 0; i < totalHours * 2; i++) {
                const totalMinsFromStart = i * 30;
                const h = startHourGlobal + Math.floor(totalMinsFromStart / 60);
                const m = totalMinsFromStart % 60;
                
                let timeStr = `${h < 10 ? '0' + h : h}:${m === 0 ? '00' : '30'}`;
                if (h === 12 && m === 0) timeStr = 'NOON';

                const timeLabel = document.createElement('div');
                timeLabel.className = m === 0 ? 'time-label hour-mark' : 'time-label';
                timeLabel.style.top = `${i * 50}px`;
                timeLabel.innerText = timeStr;
                axis.appendChild(timeLabel);
            }
            container.appendChild(axis);

            for (let dayIdx = 1; dayIdx <= 5; dayIdx++) {
                const col = document.createElement('div');
                col.className = 'day-column';
                col.id = `day-col-${dayIdx}`;
                col.style.gridColumn = dayIdx + 1;
                container.appendChild(col);
            }
        }

        function handleManualTextParse() {
            const text = document.getElementById('aimsText').value;
            if (!text.trim()) { alert('請先在文字框中貼上 AIMS 表格文字！'); return; }
            parseAIMSContent(text);
            showStatus(`✓ 成功解析文字框內容！目前共 ${courses.length} 個科目。`);
            document.getElementById('aimsText').value = '';
            renderCoursesUI();
        }

        function handleAddCustomSection() {
            const titleInput = document.getElementById('inputTitle').value.trim();
            const sectionInput = document.getElementById('inputSection').value.trim().toUpperCase();
            const dayVal = parseInt(document.getElementById('inputDay').value);
            const roomInput = document.getElementById('inputRoom').value.trim() || "TBA";
            const startTimeStr = document.getElementById('inputStartTime').value;
            const endTimeStr = document.getElementById('inputEndTime').value;

            if (!titleInput || !sectionInput) {
                alert('請填寫科目代號與課堂編號！');
                return;
            }

            const [sh, sm] = startTimeStr.split(':').map(Number);
            const [eh, em] = endTimeStr.split(':').map(Number);
            const startMins = (sh * 60) + sm;
            const endMins = (eh * 60) + em;

            if (startMins >= endMins) {
                alert('結束時間必須晚於開始時間！');
                return;
            }

            const rawTimeStr = `${startTimeStr} - ${endTimeStr}`;
            const sectionData = { day: dayVal, startMins, endMins, rawTime: rawTimeStr, room: roomInput };

            let course = courses.find(c => c.title.toLowerCase() === titleInput.toLowerCase());
            if (!course) {
                const assignedColor = distinctColorPalette[courses.length % distinctColorPalette.length];
                course = {
                    title: titleInput,
                    color: assignedColor,
                    selectedCore: "", selectedTut: "", cores: {}, tutorials: {}
                };
                courses.push(course);
            }

            if (sectionInput.startsWith('T')) {
                course.tutorials[sectionInput] = sectionData;
                course.selectedTut = sectionInput;
            } else {
                course.cores[sectionInput] = sectionData;
                course.selectedCore = sectionInput;
            }

            document.getElementById('inputSection').value = '';
            document.getElementById('inputRoom').value = '';

            showStatus(`✓ 手動補登成功！目前共 ${courses.length} 個科目。`);
            renderCoursesUI();
        }

        function showStatus(msg) {
            const statusBox = document.getElementById('statusBox');
            statusBox.style.display = 'block';
            statusBox.innerText = msg;
        }

        function parseAIMSContent(rawText) {
            let courseTitle = "Unknown Course";
            const courseMatch = rawText.match(/Course\s*:\s*([A-Z0-9\s,]+?)(?=\[|\n|$)/i);
            if (courseMatch) courseTitle = courseMatch[1].replace(/\s+/g, ' ').trim();

            const assignedColor = distinctColorPalette[courses.length % distinctColorPalette.length];

            let course = {
                title: courseTitle,
                color: assignedColor,
                selectedCore: "", selectedTut: "", cores: {}, tutorials: {}
            };

            const blocks = rawText.split(/(?=\b\d{5}\b)/);
            blocks.forEach(block => {
                const sectionMatch = block.match(/\b([CT]\d{2})\b/);
                if (!sectionMatch) return;
                const section = sectionMatch[1].toUpperCase();

                const dayMatch = block.match(/\b([MTWRFS])\b/);
                let dayIdx = dayMatch && dayMap[dayMatch[1]] ? dayMap[dayMatch[1]] : 1;

                const timeMatch = block.match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
                let startMins = 9 * 60, endMins = 12 * 60, rawTimeStr = "09:00 - 12:00";

                if (timeMatch) {
                    rawTimeStr = `${timeMatch[1]} - ${timeMatch[2]}`;
                    const [sh, sm] = timeMatch[1].split(':').map(Number);
                    const [eh, em] = timeMatch[2].split(':').map(Number);
                    startMins = (sh * 60) + sm;
                    endMins = (eh * 60) + em;
                }

                let room = "TBA";
                const singleLineRoom = block.match(/(?:YEUNG|LI|AC1|AC2|AC3|BOC)\s+([A-Z0-9\-]+)/i);
                if (singleLineRoom) room = singleLineRoom[1];
                else {
                    const fallbackRoom = block.match(/\b(LT-\d+|\d{3,4})\b/i);
                    if (fallbackRoom) room = fallbackRoom[1];
                }

                const sectionData = { day: dayIdx, startMins, endMins, rawTime: rawTimeStr, room };
                if (section.startsWith('C')) {
                    course.cores[section] = sectionData;
                    if (!course.selectedCore) course.selectedCore = section;
                } else if (section.startsWith('T')) {
                    course.tutorials[section] = sectionData;
                    if (!course.selectedTut) course.selectedTut = section;
                }
            });
            courses.push(course);
        }

        function renderCoursesUI() {
            const container = document.getElementById('courseContainer');
            container.innerHTML = '';
            courses.forEach((course, index) => {
                const card = document.createElement('div');
                card.className = 'course-card';
                card.style.borderLeft = `6px solid ${course.color.border}`;

                let coreOptions = Object.keys(course.cores).map(c => `<option value="${c}" ${course.selectedCore === c ? 'selected' : ''}>Core ${c} (${getDayName(course.cores[c].day)} ${course.cores[c].rawTime})</option>`).join('');
                let tutOptions = Object.keys(course.tutorials).map(t => `<option value="${t}" ${course.selectedTut === t ? 'selected' : ''}>Tut ${t} (${getDayName(course.tutorials[t].day)} ${course.tutorials[t].rawTime})</option>`).join('');

                card.innerHTML = `
                    <div class="course-card-header">
                        <span class="course-code" style="color: ${course.color.text}">${course.title}</span>
                        <button class="remove-btn" onclick="removeCourse(${index})">×</button>
                    </div>
                    ${coreOptions ? `<div class="select-group"><label>Core 主課：</label><select onchange="updateSelection(${index}, 'core', this.value)">${coreOptions}</select></div>` : ''}
                    ${tutOptions ? `<div class="select-group"><label>Tutorial 導修：</label><select onchange="updateSelection(${index}, 'tut', this.value)">${tutOptions}</select></div>` : ''}
                `;
                container.appendChild(card);
            });
            renderTimeline();
        }

        function getDayName(idx) { return ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'][idx - 1] || 'Mon'; }
        
        function updateSelection(index, type, val) {
            if (type === 'core') courses[index].selectedCore = val;
            if (type === 'tut') courses[index].selectedTut = val;
            renderTimeline();
        }

        function removeCourse(index) { 
            courses.splice(index, 1); 
            renderCoursesUI(); 
        }

        function renderTimeline() {
            for (let i = 1; i <= 5; i++) {
                const col = document.getElementById(`day-col-${i}`);
                if (col) col.innerHTML = '';
            }

            let activeEvents = [];

            courses.forEach(course => {
                const addEvt = (key, data, type) => {
                    if (!data) return;
                    activeEvents.push({ title: course.title, sectionLabel: `${type === 'core' ? 'Core' : 'Tut'} ${key}`, ...data, color: course.color });
                };
                if (course.selectedCore) addEvt(course.selectedCore, course.cores[course.selectedCore], 'core');
                if (course.selectedTut) addEvt(course.selectedTut, course.tutorials[course.selectedTut], 'tutorial');
            });

            let clashPairs = [];
            activeEvents.forEach((evt, i) => {
                for (let j = i + 1; j < activeEvents.length; j++) {
                    const o = activeEvents[j];
                    if (o.day === evt.day && !(o.endMins <= evt.startMins || o.startMins >= evt.endMins)) {
                        evt.hasClash = true;
                        o.hasClash = true;
                        clashPairs.push(`${evt.title} (${evt.sectionLabel}) 與 ${o.title} (${o.sectionLabel})`);
                    }
                }
            });

            activeEvents.forEach(evt => {
                const col = document.getElementById(`day-col-${evt.day}`);
                if (!col) return;

                const block = document.createElement('div');
                block.className = 'event-block';

                const baseMins = startHourGlobal * 60;
                const topPx = (evt.startMins - baseMins) * minuteHeight;
                const heightPx = (evt.endMins - evt.startMins) * minuteHeight;

                block.style.top = `${topPx}px`;
                block.style.height = `${Math.max(heightPx, 35)}px`;

                if (evt.hasClash) {
                    block.classList.add('clash');
                } else {
                    block.style.backgroundColor = evt.color.bg;
                    block.style.borderColor = evt.color.border;
                    block.style.color = evt.color.text;
                }

                let roomHtml = evt.room !== "TBA" ? `<div class="event-detail">Room: <b>${evt.room}</b></div>` : "";
                let clashIconHtml = evt.hasClash ? `<div class="clash-icon">⚠️</div>` : "";

                block.innerHTML = `
                    <div class="event-title">${evt.title}</div>
                    <div class="event-section">${evt.sectionLabel}</div>
                    <div class="event-time">${evt.rawTime}</div>
                    ${roomHtml}
                    ${clashIconHtml}
                `;
                col.appendChild(block);
            });

            const clashAlert = document.getElementById('clashAlert');
            if (clashPairs.length > 0) {
                clashAlert.style.display = 'block';
                clashAlert.innerHTML = `⚠️ 注意：以下課程時間相撞 (Clash)：<br>` + clashPairs.map(p => `• ${p}`).join('<br>');
            } else {
                clashAlert.style.display = 'none';
            }
        }
    </script>
</body>
</html>
